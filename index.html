  document.querySelectorAll('#products [data-label]').forEach(function (item) {
    var label = item.getAttribute('data-label');
    var url = '/search/label/' + label + '/?max-results=99' + (isMobile ? '&m=1' : '');
    item.setAttribute('onclick', "location.href='" + url + "'");
  });
  document.querySelectorAll('#products [onclick]').forEach(function (item) {
    if (item.hasAttribute('data-label')) return;
    var clickAttr = item.getAttribute('onclick');
    var urlMatch = clickAttr && clickAttr.match(/(['"])(.*?)\1/);
    if (!urlMatch || !urlMatch[2]) return;
    var href = urlMatch[2];
    if (isMobile && href.indexOf('m=1') === -1) {
      href += (href.indexOf('?') > -1 ? '&' : '?') + 'm=1';
      item.setAttribute('onclick', "location.href='" + href + "'");
    }
  });
  if (isMobile) {
    var mField = document.getElementById('search-m');
    if (mField) mField.setAttribute('name', 'm');
  }
})();
document.addEventListener('DOMContentLoaded', function() {
  var allElements = document.querySelectorAll('#products .non-collapse, #products .collapse');
  allElements.forEach(function (el, index) {
    setTimeout(function () { el.classList.add('visible'); }, 150 + (index * 40));
  });
});
